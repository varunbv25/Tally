<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TALLY — the ledger that keeps score</title>
<meta name="theme-color" content="#fdfefd">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- iOS ignores theme-color; this is the only status-bar lever it offers, and
     the boot script below swaps it per theme before the first paint. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
/* Stamp the theme before first paint to avoid a flash of the wrong palette,
   and colour the OS status bar to match it — Safari reads the Apple
   status-bar meta once at load, so it has to be right before we paint.
   app.js re-applies all of this once state is loaded; keep the storage key,
   the resolution logic and the two bar values in sync with applyTheme(). */
(function () {
  try {
    var pref = 'device';
    var raw = localStorage.getItem('tally-ledger-v1');
    if (raw) { var s = JSON.parse(raw); if (s && s.settings && s.settings.theme) pref = s.settings.theme; }
    var dark = pref === 'dark' || (pref === 'device' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#121212' : '#fdfefd');
    var iosBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (iosBar) iosBar.setAttribute('content', dark ? 'black-translucent' : 'default');
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark" id="home-link" role="button" tabindex="0" title="Back to the ledger">Tally<span class="wordmark-dot">.</span></h1>
    <div class="masthead-actions">
      <span class="offline-flag" id="offline-flag" role="status" hidden>
        <span class="offline-dot" aria-hidden="true"></span>Offline · showing saved data
      </span>
      <!-- Account keeps the top-right corner on every screen size: who you are
           and the cloud sync that follows from it, one tap from anywhere.
           Settings is a separate menu, pinned to the bottom-right corner. -->
      <button class="nav-icon-btn" id="account-btn" data-tab="account" aria-label="Account" title="Account">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.5a6 6 0 0 1 11.6 0"/></svg>
      </button>
    </div>
  </div>
  <!-- Primary navigation: the day-to-day views switch from these top tabs.
       Account sits in the corner above; Settings in the corner below. -->
  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <button class="tab-btn" data-tab="ledger">Ledger</button>
    <button class="tab-btn" data-tab="groups">Groups</button>
    <button class="tab-btn" data-tab="history">History</button>
  </nav>
</header>

<main id="view" class="view"></main>

<!-- Phone-only bottom navigation: the everyday views within thumb reach,
     with Settings in the last (bottom-right) slot. Hidden on wide screens,
     where the top tab bar and the corner gear take over. Splitting an expense
     lives in the Ledger header, not down here. -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Primary">
  <button class="bnav-item" data-tab="ledger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2-3-2V5z"/><path d="M8 8h8M8 12h8"/></svg>
    <span>Ledger</span>
  </button>
  <button class="bnav-item" data-tab="groups">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19a6.2 6.2 0 0 1 12.4 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.4 13.6a5.4 5.4 0 0 1 5.8 5.4"/></svg>
    <span>Groups</span>
  </button>
  <button class="bnav-item" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span>Activity</span>
  </button>
  <!-- Settings owns the bottom-right corner: last slot of the bar on the
       phone, the gear button below on wider screens. -->
  <button class="bnav-item" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.2A1.6 1.6 0 0 0 6.8 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13H3a2 2 0 0 1 0-4h.2A1.6 1.6 0 0 0 4.6 6.3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 0 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.4 1H21a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
    <span>Settings</span>
  </button>
</nav>

<!-- Wide screens have no bottom bar, so Settings gets its own gear button in
     the same bottom-right corner it occupies on the phone. -->
<button class="nav-icon-btn settings-corner" id="settings-btn" data-tab="settings" aria-label="Settings" title="Settings">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.2A1.6 1.6 0 0 0 6.8 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13H3a2 2 0 0 1 0-4h.2A1.6 1.6 0 0 0 4.6 6.3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 0 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.4 1H21a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg>
</button>

<div id="modal-root"></div>
<div id="split-root"></div>
<div id="share-root"></div>
<div id="scheduled-root"></div>
<div id="cloud-prompt-root"></div>

<footer class="colophon">
  <span>Interest accrues only on what they owe you · data lives in your browser</span>
</footer>

<script src="store.js"></script>
<script src="notif.js"></script>
<script src="push.js"></script>
<script src="cloud.js"></script>
<!-- Reusable UI components: each file defines one component (a global
     builder that returns an HTML string), reused across the views in
     app.js. Loaded before app.js so they're defined by first render. -->
<script src="components/icons.js"></script>
<script src="components/money.js"></script>
<script src="components/chip.js"></script>
<script src="components/person-name.js"></script>
<script src="components/currency-select.js"></script>
<script src="components/row-actions.js"></script>
<script src="components/toast.js"></script>
<script src="components/select-bar.js"></script>
<script src="components/confirm-overlay.js"></script>
<script src="components/quick-add.js"></script>
<script src="components/share-button.js"></script>
<script src="components/modal.js"></script>
<script src="components/panel.js"></script>
<script src="components/back-link.js"></script>
<script src="components/empty-state.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // When a deploy ships a new worker, sw.js calls skipWaiting()+clients.claim()
  // so it takes control right away. Reload once at that moment so the open page
  // runs the fresh shell instead of the code it booted with — this is what
  // stops users from sitting on stale cached HTML/CSS/JS after an update.
  // The first-ever load has no prior controller, so claim() won't reload it.
  let refreshing = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || refreshing) return;
    refreshing = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js');
}

// Ask the browser to mark our storage persistent so the ledger (localStorage +
// IndexedDB) is not evicted under storage pressure. Best-effort: it resolves
// false where unsupported or not yet granted, which changes nothing.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); });
}
</script>
</body>
</html>
