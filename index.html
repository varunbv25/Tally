<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>TALLY — the ledger that keeps score</title>
<meta name="theme-color" content="#1e5b3f">
<script>
/* Apply the saved theme before first paint so there's no light-mode flash
   when the user has chosen (or their device prefers) dark. Mirrors
   applyTheme() in app.js; LS_KEY must match store.js. */
(function () {
  try {
    var raw = localStorage.getItem('tally-ledger-v1');
    var pref = raw ? (JSON.parse(raw).settings || {}).theme : null;
    var dark = pref === 'dark' ||
      ((!pref || pref === 'system') &&
        window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) { /* default light */ }
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
/* Stamp the theme before first paint to avoid a flash of the wrong palette.
   app.js re-applies this once state is loaded; keep the storage key and the
   resolution logic in sync with applyTheme() there. */
(function () {
  try {
    var pref = 'device';
    var raw = localStorage.getItem('tally-ledger-v1');
    if (raw) { var s = JSON.parse(raw); if (s && s.settings && s.settings.theme) pref = s.settings.theme; }
    var dark = pref === 'dark' || (pref === 'device' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Tally<span class="wordmark-dot">.</span></h1>
    <div class="net-stamps" id="net-stamps"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="ledger">Ledger</button>
    <button class="tab" data-tab="groups">Groups</button>
    <button class="tab" data-tab="history">History</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>
</header>

<main id="view" class="view"></main>

<div id="modal-root"></div>
<div id="indirect-root"></div>
<div id="split-root"></div>
<div id="share-root"></div>

<footer class="colophon">
  <span>Interest accrues only on what they owe you · data lives in your browser</span>
</footer>

<script src="store.js"></script>
<script src="notif.js"></script>
<script src="push.js"></script>
<script src="cloud.js"></script>
<!-- Reusable UI components: each file defines one component (a global
     builder that returns an HTML string), reused across the views in
     app.js. Loaded before app.js so they're defined by first render. -->
<script src="components/icons.js"></script>
<script src="components/money.js"></script>
<script src="components/chip.js"></script>
<script src="components/person-name.js"></script>
<script src="components/currency-select.js"></script>
<script src="components/row-actions.js"></script>
<script src="components/toast.js"></script>
<script src="components/select-bar.js"></script>
<script src="components/confirm-overlay.js"></script>
<script src="components/quick-add.js"></script>
<script src="components/share-button.js"></script>
<script src="components/modal.js"></script>
<script src="components/panel.js"></script>
<script src="components/back-link.js"></script>
<script src="components/empty-state.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
